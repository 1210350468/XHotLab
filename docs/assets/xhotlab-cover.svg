    <rect width="461" height="63" rx="24" fill="#eeecff"/>
    <rect y="38" width="461" height="25" fill="#eeecff"/>
    <circle cx="30" cy="31" r="6" fill="#bdafe7"/><circle cx="51" cy="31" r="6" fill="#bdafe7"/><circle cx="72" cy="31" r="6" fill="#bdafe7"/>
    <text x="100" y="36" fill="#514782" font-size="16" font-weight="750" font-family="Microsoft YaHei, Arial, sans-serif">XHotLab / 发布工作台</text>
    <rect x="29" y="88" width="403" height="87" rx="15" fill="#ffffff" stroke="#e9e6f3"/>
    <rect x="45" y="104" width="56" height="56" rx="11" fill="#dcd4fb"/>
    <path d="M62 118L81 132L62 146Z" fill="#7a62d8"/>
    <text x="116" y="122" font-size="12" fill="#8b83a7" font-family="Microsoft YaHei, Arial, sans-serif">01 / CHOOSE</text>
    <text x="116" y="147" font-size="19" fill="#302b4d" font-weight="700" font-family="Microsoft YaHei, Arial, sans-serif">选择热门视频与素材</text>
    <rect x="29" y="192" width="403" height="132" rx="15" fill="#ffffff" stroke="#e9e6f3"/>
    <text x="48" y="216" font-size="12" fill="#8b83a7" font-family="Microsoft YaHei, Arial, sans-serif">02 / WRITE</text>
    <text x="48" y="246" font-size="18" font-weight="700" fill="#302b4d" font-family="Microsoft YaHei, Arial, sans-serif">自己决定要发布的文字</text>
    <rect x="48" y="263" width="351" height="10" rx="5" fill="#ece9f7"/>
    <rect x="48" y="282" width="268" height="10" rx="5" fill="#ece9f7"/>
    <rect x="29" y="345" width="403" height="60" rx="13" fill="#765bda"/>
    <path d="M359 367L375 376L359 385L362 377Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    <text x="52" y="382" font-size="20" font-weight="750" fill="white" font-family="Microsoft YaHei, Arial, sans-serif">03 / 打开 X 编辑器</text>
  </g>
